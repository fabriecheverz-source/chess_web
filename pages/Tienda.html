        <section>
            <h1>Tienda de Ajedrez</h1>
            <p>
                Encontrá tableros, piezas, relojes y accesorios para
                disfrutar del ajedrez.
            </p>
        </section>
        <section class="tienda">
            <div class="productos">
                <div
                    class="container row"
                    id="contenedorProductos">
                    <div class="row">
                    </div>

            <aside class="carrito">
                <h2>Carrito</h2>
                <div id="productosCarrito">
                    <p>El carrito está vacío.</p>
                </div>
                <h3 id="totalCompra">
                    Total: $0
                </h3>
                <button id="vaciarCarrito">
                    Vaciar carrito
                </button>
                <button id="finalizarCompra">
                    Finalizar compra
                </button>
            </aside>
        </section>
